[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Puerto serial donde está conectado tu ESP32
upload_port = COM3
monitor_port = COM3

; Velocidades
upload_speed = 921600
monitor_speed = 115200

; Librerías del proyecto
lib_deps =
    madhephaestus/ESP32Servo@^1.1.2